[package]
name = "solana-onchain-rate-limiter"
version = "0.1.0"
edition = "2021"
description = "High-throughput token bucket rate limiter and quota management program on Solana"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = { version = "1.5.1", features = ["derive"] }
thiserror = "1.0.61"

[dev-dependencies]
rand = "0.8.5"
